name: Build Anime Combat Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Resolve latest Fabric versions for this Minecraft version
        shell: bash
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          YARN=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/yarn/${MC}" | jq -r 'sort_by(.build) | reverse | .[0].version')
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable == true)][0].version')
          API=$(curl -fsSL "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml" \
                | grep -o "<version>[^<]*+${MC}</version>" | sed 's/<[^>]*>//g' | tail -1)
          for v in "$YARN" "$LOADER" "$API"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then
              echo "::error::Could not resolve Fabric versions for Minecraft ${MC} (yarn='${YARN}' loader='${LOADER}' api='${API}')"
              exit 1
            fi
          done
          printf '\nloader_version=%s\nyarn_mappings=%s\nfabric_api_version=%s\n' "$LOADER" "$YARN" "$API" >> gradle.properties
          {
            echo "### Resolved versions"
            echo "- Minecraft: ${MC}"
            echo "- Yarn: ${YARN}"
            echo "- Fabric Loader: ${LOADER}"
            echo "- Fabric API: ${API}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run core tests
        shell: bash
        run: gradle coreTest --stacktrace --console=plain 2>&1 | tee core-tests.log

      - name: Build mod jar
        shell: bash
        run: gradle build --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify jar
        shell: bash
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -1)
          echo "Built: $JAR"
          unzip -tq "$JAR"
          unzip -l "$JAR" | grep -E 'fabric.mod.json|AnimeCombatMod.class'
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"

      - name: Package source project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          zip -qr "$RUNNER_TEMP/pkg/anime-combat-mod-source.zip" . -x ".git/*" "build/*" ".gradle/*" "*.log"
          cp "$RUNNER_TEMP/pkg/anime-combat-mod-source.zip" .

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: anime-combat-mod-jar-${{ github.run_number }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anime-combat-mod-source-${{ github.run_number }}
          path: anime-combat-mod-source.zip
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            core-tests.log
            build.log
          if-no-files-found: ignore
